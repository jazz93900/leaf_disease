<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="100%" height="100%" style="background:#0f172a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="grad-header" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="grad-badge-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="grad-badge-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="grad-badge-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="grad-badge-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="30" y="20" width="1040" height="60" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="50" y="56" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="0.5">🌿 AgriVision — End-to-End System Architecture</text>
  <rect x="760" y="35" width="140" height="30" rx="6" fill="url(#grad-badge-green)"/>
  <text x="830" y="55" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">VAL ACC: 98.87%</text>
  <rect x="915" y="35" width="135" height="30" rx="6" fill="url(#grad-badge-blue)"/>
  <text x="982" y="55" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">LATENCY: &lt;15ms</text>

  <!-- COLUMN 1: Client Presentation Layer -->
  <rect x="30" y="100" width="220" height="560" rx="14" fill="url(#grad-card)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="30" y="100" width="220" height="42" rx="14" fill="#0284c7" />
  <rect x="30" y="128" width="220" height="14" fill="#0284c7" />
  <text x="140" y="127" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">1. CLIENT LAYER</text>

  <!-- Mobile Card -->
  <rect x="45" y="160" width="190" height="230" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="55" y="185" fill="#38bdf8" font-size="14" font-weight="700">📱 Mobile Application</text>
  <text x="55" y="205" fill="#94a3b8" font-size="11">React Native • Expo SDK 58</text>
  <path d="M 55 215 L 225 215" stroke="#334155" stroke-width="1"/>
  <text x="55" y="235" fill="#e2e8f0" font-size="11.5">• 3-Leaf Slot Scanner</text>
  <text x="55" y="255" fill="#e2e8f0" font-size="11.5">• Auto-Fill Dummy Fallback</text>
  <text x="55" y="275" fill="#e2e8f0" font-size="11.5">• Blur/Quality Alert Banner</text>
  <text x="55" y="295" fill="#e2e8f0" font-size="11.5">• GPS Weather Telemetry</text>
  <text x="55" y="315" fill="#e2e8f0" font-size="11.5">• 5-Stage Triage Survey</text>
  <text x="55" y="335" fill="#e2e8f0" font-size="11.5">• Farmer Support Desk</text>
  <text x="55" y="355" fill="#e2e8f0" font-size="11.5">• 1-Tap Kisan Helpline</text>
  <text x="55" y="375" fill="#10b981" font-size="11" font-weight="600">Android • iOS • Web</text>

  <!-- Web Card -->
  <rect x="45" y="410" width="190" height="225" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="55" y="435" fill="#38bdf8" font-size="14" font-weight="700">💻 Web Dashboard</text>
  <text x="55" y="455" fill="#94a3b8" font-size="11">React 18 • Vite Bundler</text>
  <path d="M 55 465 L 225 465" stroke="#334155" stroke-width="1"/>
  <text x="55" y="485" fill="#e2e8f0" font-size="11.5">• Drag &amp; Drop Leaf Upload</text>
  <text x="55" y="505" fill="#e2e8f0" font-size="11.5">• 1-Click Benchmark Demos</text>
  <text x="55" y="525" fill="#e2e8f0" font-size="11.5">• Grad-CAM Heatmap Slider</text>
  <text x="55" y="545" fill="#e2e8f0" font-size="11.5">• Real-Time Latency Meter</text>
  <text x="55" y="565" fill="#e2e8f0" font-size="11.5">• Background Mask Switch</text>
  <text x="55" y="585" fill="#e2e8f0" font-size="11.5">• Curative Remedy Cards</text>
  <text x="55" y="615" fill="#10b981" font-size="11" font-weight="600">Desktop &amp; Tablet Ready</text>

  <!-- CONNECTOR 1 -> 2 -->
  <path d="M 250 270 L 295 270" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 250 510 L 275 510 L 275 320 L 295 320" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- COLUMN 2: API Gateway Layer -->
  <rect x="305" y="100" width="220" height="560" rx="14" fill="url(#grad-card)" stroke="#06b6d4" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="305" y="100" width="220" height="42" rx="14" fill="#0891b2" />
  <rect x="305" y="128" width="220" height="14" fill="#0891b2" />
  <text x="415" y="127" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">2. API GATEWAY</text>

  <rect x="320" y="160" width="190" height="475" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="330" y="185" fill="#06b6d4" font-size="14" font-weight="700">⚡ FastAPI Service</text>
  <text x="330" y="205" fill="#94a3b8" font-size="11">Uvicorn ASGI • Port 8000</text>
  <path d="M 330 215 L 500 215" stroke="#334155" stroke-width="1"/>

  <rect x="330" y="225" width="170" height="60" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="340" y="245" fill="#34d399" font-size="11" font-weight="700">POST /predict</text>
  <text x="340" y="262" fill="#94a3b8" font-size="10">Single leaf inference &amp;</text>
  <text x="340" y="276" fill="#94a3b8" font-size="10">Grad-CAM base64 heatmap</text>

  <rect x="330" y="295" width="170" height="60" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="340" y="315" fill="#38bdf8" font-size="11" font-weight="700">POST /validate-leaf</text>
  <text x="340" y="332" fill="#94a3b8" font-size="10">Pre-inference blur, light,</text>
  <text x="340" y="346" fill="#94a3b8" font-size="10">&amp; foliage quality audit</text>

  <rect x="330" y="365" width="170" height="60" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="340" y="385" fill="#fbbf24" font-size="11" font-weight="700">POST /predict-batch</text>
  <text x="340" y="402" fill="#94a3b8" font-size="10">Multi-leaf canopy voting</text>
  <text x="340" y="416" fill="#94a3b8" font-size="10">&amp; weighted ensemble</text>

  <rect x="330" y="435" width="170" height="50" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="340" y="455" fill="#a78bfa" font-size="11" font-weight="700">GET /health &amp; /docs</text>
  <text x="340" y="472" fill="#94a3b8" font-size="10">Swagger UI &amp; Health Probe</text>

  <rect x="330" y="495" width="170" height="120" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="340" y="515" fill="#f43f5e" font-size="11" font-weight="700">🛡️ Input Ingestion</text>
  <text x="340" y="533" fill="#cbd5e1" font-size="10">• Multipart Form-Data</text>
  <text x="340" y="551" fill="#cbd5e1" font-size="10">• Base64 Data URI</text>
  <text x="340" y="569" fill="#cbd5e1" font-size="10">• Remote URL Download</text>
  <text x="340" y="587" fill="#cbd5e1" font-size="10">• CORS Enabled (All IPs)</text>
  <text x="340" y="605" fill="#10b981" font-size="10" font-weight="600">• Zero Leakage Validation</text>

  <!-- CONNECTOR 2 -> 3 -->
  <path d="M 525 295 L 560 295" stroke="#06b6d4" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- COLUMN 3: Preprocessing & CV Gate -->
  <rect x="570" y="100" width="220" height="560" rx="14" fill="url(#grad-card)" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="570" y="100" width="220" height="42" rx="14" fill="#059669" />
  <rect x="570" y="128" width="220" height="14" fill="#059669" />
  <text x="680" y="127" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">3. CV &amp; QUALITY GATE</text>

  <rect x="585" y="160" width="190" height="475" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="595" y="185" fill="#10b981" font-size="14" font-weight="700">🔍 OpenCV Engine</text>
  <text x="595" y="205" fill="#94a3b8" font-size="11">Filtering &amp; Normalization</text>
  <path d="M 595 215 L 765 215" stroke="#334155" stroke-width="1"/>

  <rect x="595" y="225" width="170" height="85" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="605" y="245" fill="#38bdf8" font-size="11" font-weight="700">Laplacian Blur Check</text>
  <text x="605" y="263" fill="#cbd5e1" font-size="10">• Variance &gt; 100 Gate</text>
  <text x="605" y="281" fill="#cbd5e1" font-size="10">• Rejects Blurry Clicks</text>
  <text x="605" y="299" fill="#f87171" font-size="10">Alert: "Click Again"</text>

  <rect x="595" y="320" width="170" height="75" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="605" y="340" fill="#fbbf24" font-size="11" font-weight="700">Luminance Filter</text>
  <text x="605" y="358" fill="#cbd5e1" font-size="10">• Mean Value: [40, 225]</text>
  <text x="605" y="376" fill="#cbd5e1" font-size="10">• Rejects Dark / Overlit</text>

  <rect x="595" y="405" width="170" height="85" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="605" y="425" fill="#34d399" font-size="11" font-weight="700">HSV Tissue Detection</text>
  <text x="605" y="443" fill="#cbd5e1" font-size="10">• Green / Brown Range</text>
  <text x="605" y="461" fill="#cbd5e1" font-size="10">• Ratio &gt; 15% required</text>
  <text x="605" y="479" fill="#f87171" font-size="10">Rejects non-leaf clutter</text>

  <rect x="595" y="500" width="170" height="115" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="605" y="520" fill="#a78bfa" font-size="11" font-weight="700">Tensor Preprocessing</text>
  <text x="605" y="538" fill="#cbd5e1" font-size="10">• Resize to 224x224</text>
  <text x="605" y="556" fill="#cbd5e1" font-size="10">• ImageNet Normalization</text>
  <text x="605" y="574" fill="#cbd5e1" font-size="10">• Optional Otsu Masking</text>
  <text x="605" y="592" fill="#cbd5e1" font-size="10">• HSV Color Threshold</text>

  <!-- CONNECTOR 3 -> 4 -->
  <path d="M 790 340 L 830 340" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- COLUMN 4: Deep Learning & Agro-Services -->
  <rect x="840" y="100" width="230" height="560" rx="14" fill="url(#grad-card)" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="840" y="100" width="230" height="42" rx="14" fill="#7c3aed" />
  <rect x="840" y="128" width="230" height="14" fill="#7c3aed" />
  <text x="955" y="127" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">4. AI &amp; DECISION ENGINE</text>

  <rect x="855" y="160" width="200" height="475" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="865" y="185" fill="#a78bfa" font-size="14" font-weight="700">🧠 MobileNetV3-Large</text>
  <text x="865" y="205" fill="#94a3b8" font-size="11">PyTorch 2.x • Edge Optimized</text>
  <path d="M 865 215 L 1045 215" stroke="#334155" stroke-width="1"/>

  <rect x="865" y="225" width="180" height="110" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="875" y="245" fill="#38bdf8" font-size="11" font-weight="700">Architecture Features</text>
  <text x="875" y="263" fill="#cbd5e1" font-size="10">• Inverted Bottlenecks</text>
  <text x="875" y="281" fill="#cbd5e1" font-size="10">• Squeeze-and-Excitation</text>
  <text x="875" y="299" fill="#cbd5e1" font-size="10">• Hard-Swish Activations</text>
  <text x="875" y="317" fill="#10b981" font-size="10" font-weight="600">15 Agricultural Classes</text>

  <rect x="865" y="345" width="180" height="95" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="875" y="365" fill="#f43f5e" font-size="11" font-weight="700">🔥 Grad-CAM Heatmaps</text>
  <text x="875" y="383" fill="#cbd5e1" font-size="10">• Gradient Backprop on</text>
  <text x="875" y="401" fill="#cbd5e1" font-size="10">  features[16] layer</text>
  <text x="875" y="419" fill="#fbbf24" font-size="10">Transparent lesion highlight</text>

  <rect x="865" y="450" width="180" height="85" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="875" y="470" fill="#38bdf8" font-size="11" font-weight="700">⛅ Open-Meteo Weather</text>
  <text x="875" y="488" fill="#cbd5e1" font-size="10">• Live GPS Telemetry</text>
  <text x="875" y="506" fill="#cbd5e1" font-size="10">• Humidity &amp; Temp Outbreak</text>
  <text x="875" y="524" fill="#10b981" font-size="10">Early Spore Risk Alerts</text>

  <rect x="865" y="545" width="180" height="75" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="875" y="565" fill="#34d399" font-size="11" font-weight="700">💊 Agronomic Prescriptions</text>
  <text x="875" y="583" fill="#cbd5e1" font-size="10">• Chemical &amp; Organic dosage</text>
  <text x="875" y="601" fill="#cbd5e1" font-size="10">• Kisan Helpline (1800-180-1551)</text>

  <!-- Return Flow Line from 4 back to 1 -->
  <path d="M 945 635 L 945 675 L 140 675 L 140 660" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="540" y="692" fill="#94a3b8" font-size="11" text-anchor="middle">Bi-Directional Diagnostic Feedback Loop: Result JSON + Base64 Grad-CAM Overlay + Microclimate Warning</text>
</svg>
